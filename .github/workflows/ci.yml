name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version

      # A fresh runner has an empty registry index, so dependencies
      # (moonbitlang/x, bobzhang/zip, ...) cannot be resolved until the index
      # is fetched.
      - name: Update registry index
        run: moon update

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      - name: Build (native, release)
        run: moon build --target native --release
